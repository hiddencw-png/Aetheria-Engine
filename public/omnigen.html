<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OmniGen - App & Game Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        @keyframes slideIn { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        .animate-slideIn { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; } 
        
        /* Monaco Container */
        .monaco-editor-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Glassmorphism */
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-input { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input:focus-within { border-color: rgba(59, 130, 246, 0.5); background: rgba(255, 255, 255, 0.05); }

        /* Loader */
        .cyber-loader {
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }
        @media (min-width: 768px) {
            .cyber-loader { width: 100px; height: 100px; }
        }
        .cyber-loader::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 3px solid transparent;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* iOS Safe Area Utilities */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 0px); }
        .safe-h-nav { height: calc(3.5rem + env(safe-area-inset-bottom, 0px)); }
        .safe-h-header { height: calc(3.5rem + env(safe-area-inset-top, 0px)); }
        
        /* Prevent iOS Zoom on Inputs */
        input[type="text"], textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons ---
        const Icons = {
            Wand: (props) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path><path d="M17.8 11.8 19 13"></path><path d="M15 9h0"></path><path d="M17.8 6.2 19 5"></path><path d="m3 21 9-9"></path><path d="M12.2 6.2 11 5"></path></svg>,
            Code: (props) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>,
            Play: (props) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Cpu: (props) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>,
            ArrowRight: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
            Send: (props) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Wrench: (props) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>,
            Copy: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Download: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            X: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Save: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Folder: (props) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            Undo: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>,
            Redo: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>,
            Terminal: (props) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>,
            Trash: (props) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        };

        // --- Monaco Editor Component ---
        const MonacoEditor = ({ value, onChange }) => {
            const containerRef = useRef(null);
            const editorRef = useRef(null);
            
            useEffect(() => {
                let isMounted = true;
                const initMonaco = () => {
                    if (!isMounted || !containerRef.current || editorRef.current) return;
                    if (typeof window.monaco !== 'undefined' && window.monaco.editor) {
                        editorRef.current = window.monaco.editor.create(containerRef.current, {
                            value: value,
                            language: 'html',
                            theme: 'vs-dark',
                            automaticLayout: true,
                            minimap: { enabled: false },
                            fontSize: window.innerWidth < 768 ? 12 : 14,
                            fontFamily: "'JetBrains Mono', 'Consolas', monospace",
                            padding: { top: 16 },
                            scrollBeyondLastLine: false,
                            wordWrap: 'on'
                        });
                        editorRef.current.onDidChangeModelContent(() => {
                            onChange(editorRef.current.getValue());
                        });
                    }
                };

                if (window.monaco && window.monaco.editor) {
                    initMonaco();
                } else {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js';
                    script.onload = () => {
                        window.require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
                        window.require(['vs/editor/editor.main'], () => {
                            if (isMounted) initMonaco();
                        });
                    };
                    document.body.appendChild(script);
                }

                return () => {
                    isMounted = false;
                    if (editorRef.current) {
                        editorRef.current.dispose();
                        editorRef.current = null;
                    }
                };
            }, []);

            useEffect(() => {
                if (editorRef.current) {
                    const model = editorRef.current.getModel();
                    if (model && value !== model.getValue()) {
                        editorRef.current.setValue(value);
                    }
                }
            }, [value]);

            return <div ref={containerRef} className="monaco-editor-container" />;
        };

        // --- API Integration ---
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const generateAppCode = async (prompt, isRefinement = false, currentCode = "") => {
            const apiKey = ""; // Runtime populated by execution environment
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const systemPrompt = `You are OmniGen, a legendary 10x full-stack developer AI.
The user will provide the name of a game, app, or website.
Your objective is to generate the COMPLETE, fully functional, production-ready source code for it in a SINGLE HTML file.
CRITICAL RULES:
1. Output ONLY a valid JSON object strictly conforming to this schema: { "code": "<complete_html_string>" }
2. The HTML MUST contain ALL CSS (Tailwind classes via CDN strongly preferred) and ALL JavaScript needed to make the app fully functional.
3. For Games: Include the game loop, canvas/DOM rendering, collision detection, score, and restart logic. Ensure the animation loop starts strictly AFTER window onload. Include mobile touch events (touchstart, touchend, touchmove) as alternatives to keyboard inputs.
4. For Apps: Include interactive UI, state management, and mock functionality. Do NOT use standard browser alerts (alert()), build custom modal UI if needed. Ensure highly responsive design targeting mobile screens.
5. DO NOT wrap the JSON in markdown formatting (no \`\`\`json). Return raw JSON only.
6. DO NOT use placeholders like "logic goes here". Write the actual execution logic.
7. Ensure responsive design and a modern, polished aesthetic. Use relative viewport units or Tailwind's responsive prefixes.
8. PREVENT RUNTIME CRASHES: Ensure strict DOM lifecycle management. If using React, provide complete useEffect cleanup functions.`;

            let userPromptText = `Build this application/game fully functioning: ${prompt}`;
            if (isRefinement) {
                userPromptText = `Here is the current code state:\n\`\`\`html\n${currentCode}\n\`\`\`\n\nApply the following refinement/update to the code and return the FULL updated HTML file: ${prompt}`;
            }

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPromptText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            code: { type: "STRING", description: "The complete, standalone HTML code." }
                        },
                        required: ["code"]
                    }
                }
            };

            const response = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (!resultText) throw new Error("Invalid API response format");
            
            // Robust parsing: extract JSON from markdown wrappers if AI hallucinates formatting
            const jsonMatch = resultText.match(/```json\n([\s\S]*?)\n```/ ) || resultText.match(/```\n([\s\S]*?)\n```/ );
            let rawJson = jsonMatch ? jsonMatch[1] : resultText;
            
            // Fallback aggressive sanitization
            rawJson = rawJson.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
            
            try {
                const parsed = JSON.parse(rawJson);
                if (typeof parsed.code !== 'string') {
                    throw new Error("Parsed JSON is missing the required 'code' string property.");
                }
                return parsed.code;
            } catch (err) {
                // Failsafe for raw HTML output
                if (rawJson.trim().startsWith("<!DOCTYPE html>") || rawJson.trim().startsWith("<html")) {
                    console.warn("API returned raw HTML instead of JSON. Recovering...");
                    return rawJson.trim();
                }
                console.error("JSON Parsing Error on Payload:", rawJson);
                throw new Error("Failed to parse AI response as valid format: " + err.message);
            }
        };

        // --- Main Application ---
        const App = () => {
            const [view, setView] = useState('landing'); // 'landing', 'generating', 'ide'
            const [prompt, setPrompt] = useState('');
            const [code, setCode] = useState('');
            const [activeTab, setActiveTab] = useState('preview'); // 'preview', 'code', 'tools'
            const [previewError, setPreviewError] = useState(null);
            const [generationError, setGenerationError] = useState(null);
            const [refinementPrompt, setRefinementPrompt] = useState('');
            const [isRefining, setIsRefining] = useState(false);
            const [toast, setToast] = useState(null);
            const [savedProjects, setSavedProjects] = useState([]);
            
            // --- New State for Upgrades ---
            const [codeHistory, setCodeHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);
            const [logs, setLogs] = useState([]);
            const [isConsoleOpen, setIsConsoleOpen] = useState(false);
            
            const inputRef = useRef(null);
            const toastTimeout = useRef(null);

            const showToast = useCallback((msg) => {
                setToast(msg);
                if (toastTimeout.current) clearTimeout(toastTimeout.current);
                toastTimeout.current = setTimeout(() => setToast(null), 3000);
            }, []);

            useEffect(() => {
                if (view === 'landing' && inputRef.current && window.innerWidth > 768) {
                    inputRef.current.focus();
                }
            }, [view]);

            useEffect(() => {
                const saved = localStorage.getItem('omnigen_projects');
                if (saved) {
                    try { setSavedProjects(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            // History Manager
            const pushToHistory = useCallback((newCode) => {
                setCodeHistory(prev => {
                    const newHist = prev.slice(0, historyIndex + 1);
                    newHist.push(newCode);
                    return newHist;
                });
                setHistoryIndex(prev => prev + 1);
                setCode(newCode);
                setLogs([]); // Clear logs on new code load
            }, [historyIndex]);

            const handleUndo = () => {
                if (historyIndex > 0) {
                    setHistoryIndex(prev => prev - 1);
                    setCode(codeHistory[historyIndex - 1]);
                    setLogs([]);
                }
            };

            const handleRedo = () => {
                if (historyIndex < codeHistory.length - 1) {
                    setHistoryIndex(prev => prev + 1);
                    setCode(codeHistory[historyIndex + 1]);
                    setLogs([]);
                }
            };

            // Handle Preview Errors via postMessage from iframe
            useEffect(() => {
                const handleMessage = (e) => {
                    if (e.data && e.data.type === 'preview-error') {
                        setPreviewError(e.data.message);
                    }
                    if (e.data && e.data.type && e.data.type.startsWith('omnigen-console-')) {
                        setLogs(prev => [...prev, {
                            type: e.data.type,
                            message: e.data.message,
                            time: new Date().toLocaleTimeString('en-US', { hour12: false })
                        }]);
                    }
                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, []);

            const handleGenerate = async (e) => {
                if (e) e.preventDefault();
                const trimmed = prompt.trim();
                if (!trimmed) return;

                if (inputRef.current) inputRef.current.blur();
                setView('generating');
                setGenerationError(null);
                setPreviewError(null);

                try {
                    const generatedCode = await generateAppCode(trimmed);
                    pushToHistory(generatedCode);
                    setView('ide');
                    setActiveTab('preview');
                } catch (error) {
                    console.error("Generation failed:", error);
                    setGenerationError(error.message);
                    setView('landing');
                }
            };

            const handleRefine = async (e) => {
                if (e) e.preventDefault();
                const trimmed = refinementPrompt.trim();
                if (!trimmed || isRefining) return;

                setIsRefining(true);
                setPreviewError(null);

                try {
                    const updatedCode = await generateAppCode(trimmed, true, code);
                    pushToHistory(updatedCode);
                    setRefinementPrompt('');
                    setActiveTab('preview');
                    showToast("Code refined successfully.");
                } catch (error) {
                    console.error("Refinement failed:", error);
                    setPreviewError(`System Error: ${error.message}`);
                } finally {
                    setIsRefining(false);
                }
            };

            const handleAutoFix = async () => {
                if (!previewError || isRefining) return;
                
                setIsRefining(true);
                const diagnosticPrompt = `The application crashed with the following runtime error: "${previewError}". Analyze the lifecycle mechanisms (React unmounting phases, DOM removeChild mutations, or active intervals) causing this crash, apply the fix, and return the fully functional, updated code block.`;
                
                try {
                    const updatedCode = await generateAppCode(diagnosticPrompt, true, code);
                    pushToHistory(updatedCode);
                    setPreviewError(null);
                    setActiveTab('preview');
                    showToast("Error autonomously resolved.");
                } catch (error) {
                    console.error("Auto-Fix failed:", error);
                    setPreviewError(`Auto-Fix Failed: ${error.message}`);
                } finally {
                    setIsRefining(false);
                }
            };

            const handleCopyCode = () => {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = code;
                    textArea.style.position = "absolute";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    textArea.remove();
                    
                    showToast("Code copied to clipboard.");
                } catch (err) {
                    console.error("Failed to copy", err);
                    showToast("Failed to copy code.");
                }
            };

            const handleDownloadFile = () => {
                try {
                    const blob = new Blob([code], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${prompt.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() || 'omnigen-build'}.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast("File download initiated.");
                } catch (err) {
                    console.error("Download failed", err);
                    showToast("Failed to download file.");
                }
            };

            const handleSaveProject = () => {
                const newProject = {
                    id: Date.now().toString(),
                    prompt: prompt || 'Untitled Project',
                    code: code,
                    date: new Date().toLocaleDateString()
                };
                
                let updated;
                const existingIndex = savedProjects.findIndex(p => p.prompt === prompt);
                if (existingIndex >= 0) {
                    updated = [...savedProjects];
                    updated[existingIndex] = newProject;
                } else {
                    updated = [newProject, ...savedProjects];
                }
                
                setSavedProjects(updated);
                localStorage.setItem('omnigen_projects', JSON.stringify(updated));
                showToast("Project saved locally.");
            };

            const loadProject = (project) => {
                setPrompt(project.prompt);
                pushToHistory(project.code);
                setView('ide');
                setActiveTab('preview');
                setPreviewError(null);
            };

            const deleteProject = (e, id) => {
                e.stopPropagation();
                const updated = savedProjects.filter(p => p.id !== id);
                setSavedProjects(updated);
                localStorage.setItem('omnigen_projects', JSON.stringify(updated));
            };

            // Enhanced Error Tracker Injection
            const getPreviewSrcDoc = () => {
                const interceptorScript = `
                    <script>
                        const _post = (type, args) => {
                            try {
                                const parsed = Array.from(args).map(arg => {
                                    if (typeof arg === 'object') {
                                        try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                                    }
                                    return String(arg);
                                }).join(' ');
                                window.parent.postMessage({ type: 'omnigen-console-' + type, message: parsed }, '*');
                            } catch(e) {}
                        };
                        const _log = console.log;
                        const _err = console.error;
                        const _warn = console.warn;
                        const _info = console.info;

                        console.log = (...args) => { _post('log', args); _log(...args); };
                        console.error = (...args) => { _post('error', args); _err(...args); };
                        console.warn = (...args) => { _post('warn', args); _warn(...args); };
                        console.info = (...args) => { _post('info', args); _info(...args); };

                        window.onerror = function(msg, url, line, col, error) {
                            _post('error', [msg + ' (Line ' + line + ':' + col + ')']);
                            window.parent.postMessage({ type: 'preview-error', message: msg + ' (Line ' + line + ':' + col + ')' }, '*');
                            return false;
                        };
                        window.onunhandledrejection = function(event) {
                            const reason = event.reason ? (event.reason.message || event.reason) : 'Unknown Promise Error';
                            _post('error', ['Unhandled Rejection: ' + reason]);
                            window.parent.postMessage({ type: 'preview-error', message: 'Unhandled Rejection: ' + reason }, '*');
                        };
                    <\/script>
                `;

                const headRegex = /<head[^>]*>/i;
                const htmlRegex = /<html[^>]*>/i;

                if (headRegex.test(code)) {
                    return code.replace(headRegex, (match) => match + interceptorScript);
                } else if (htmlRegex.test(code)) {
                    return code.replace(htmlRegex, (match) => match + '<head>' + interceptorScript + '</head>');
                } else {
                    return interceptorScript + code;
                }
            };

            // --- Views ---
            if (view === 'landing') {
                return (
                    <div className="flex flex-col items-center justify-center h-[100dvh] relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1e293b] via-[#050505] to-[#000000] p-4 md:p-6">
                        
                        {/* Error Banner */}
                        {generationError && (
                            <div className="absolute top-safe z-50 mt-4 bg-red-900/90 text-red-200 px-4 md:px-6 py-3 rounded-xl border border-red-700 shadow-2xl flex items-center gap-3 backdrop-blur-md animate-float w-[90%] md:w-auto max-w-3xl text-xs md:text-sm">
                                <span className="w-2 h-2 md:w-2.5 md:h-2.5 rounded-full bg-red-500 animate-pulse shrink-0"></span>
                                <span className="font-medium break-words flex-1">Generation Failed: {generationError}</span>
                                <button onClick={() => setGenerationError(null)} className="ml-auto text-red-400 hover:text-white transition p-1">✕</button>
                            </div>
                        )}

                        {/* Background Decor */}
                        <div className="absolute top-[-10%] left-[-10%] w-[60%] md:w-[40%] h-[40%] bg-blue-600/20 blur-[100px] md:blur-[120px] rounded-full mix-blend-screen pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[50%] md:w-[30%] h-[30%] bg-indigo-600/20 blur-[80px] md:blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>

                        <div className="z-10 flex flex-col items-center w-full max-w-3xl animate-float">
                            <div className="w-16 h-16 md:w-20 md:h-20 mb-6 md:mb-8 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_40px_rgba(59,130,246,0.5)]">
                                <Icons.Cpu className="w-8 h-8 md:w-10 md:h-10 text-white" />
                            </div>
                            
                            <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-white text-center tracking-tight mb-3 md:mb-4">
                                OmniGen Studio
                            </h1>
                            <p className="text-base md:text-xl text-slate-400 mb-8 md:mb-12 text-center max-w-2xl font-light px-2">
                                Instantly generate full-stack source code. Type the name of a game, website, or utility app.
                            </p>

                            <form onSubmit={handleGenerate} className="w-full relative group">
                                <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl md:rounded-3xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                                <div className="relative glass-input rounded-2xl md:rounded-3xl flex flex-col md:flex-row p-2 shadow-2xl gap-2 md:gap-0">
                                    <div className="flex items-center w-full flex-1">
                                        <div className="pl-3 md:pl-4 pr-2 text-blue-400">
                                            <Icons.Wand className="w-5 h-5 md:w-6 md:h-6" />
                                        </div>
                                        <input
                                            ref={inputRef}
                                            type="text"
                                            value={prompt}
                                            onChange={(e) => setPrompt(e.target.value)}
                                            placeholder="e.g. Pacman Arcade, Calculator..."
                                            className="w-full bg-transparent text-white placeholder-slate-500 py-3 md:py-4 pr-3 focus:outline-none"
                                            autoComplete="off"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={!prompt.trim()}
                                        className="w-full md:w-auto bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold py-3 md:py-3 px-4 md:px-6 rounded-xl md:rounded-2xl md:ml-2 transition-all flex items-center justify-center gap-2 animate-pulse-glow"
                                    >
                                        <span className="md:inline">Generate</span> <Icons.ArrowRight className="w-5 h-5" />
                                    </button>
                                </div>
                            </form>

                            <div className="mt-8 md:mt-12 flex flex-wrap justify-center gap-3 text-xs md:text-sm text-slate-500">
                                <span className="cursor-pointer bg-white/5 px-3 py-1.5 rounded-full hover:text-blue-400 hover:bg-white/10 transition" onClick={() => setPrompt("Pacman Arcade Game")}>🎮 Pacman</span>
                                <span className="cursor-pointer bg-white/5 px-3 py-1.5 rounded-full hover:text-blue-400 hover:bg-white/10 transition" onClick={() => setPrompt("Scientific Calculator")}>🔢 Calculator</span>
                                <span className="cursor-pointer bg-white/5 px-3 py-1.5 rounded-full hover:text-blue-400 hover:bg-white/10 transition" onClick={() => setPrompt("Interactive Periodic Table")}>🧪 Periodic Table</span>
                            </div>

                            {savedProjects.length > 0 && (
                                <div className="mt-12 w-full max-w-4xl animate-slideIn px-4">
                                    <h3 className="text-sm font-semibold text-slate-400 mb-4 flex items-center gap-2">
                                        <Icons.Folder className="w-4 h-4" /> Your Saved Projects
                                    </h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {savedProjects.map(proj => (
                                            <div 
                                                key={proj.id} 
                                                onClick={() => loadProject(proj)}
                                                className="bg-[#1e293b]/40 border border-[#334155]/50 hover:border-blue-500/50 rounded-xl p-4 cursor-pointer transition-all hover:-translate-y-1 group relative flex flex-col shadow-lg backdrop-blur-sm"
                                            >
                                                <button 
                                                    onClick={(e) => deleteProject(e, proj.id)}
                                                    className="absolute top-3 right-3 text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"
                                                    title="Delete Project"
                                                >
                                                    <Icons.X className="w-4 h-4" />
                                                </button>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <Icons.Code className="w-4 h-4 text-blue-400 shrink-0" />
                                                    <h4 className="text-white font-medium truncate pr-6 text-sm">{proj.prompt}</h4>
                                                </div>
                                                <p className="text-xs text-slate-500 mt-auto pt-4 flex items-center justify-between">
                                                    <span>Local Save</span>
                                                    <span>{proj.date}</span>
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'generating') {
                return (
                    <div className="flex flex-col items-center justify-center h-[100dvh] bg-[#050505] p-6 text-center">
                        <div className="cyber-loader mb-6 md:mb-8"></div>
                        <h2 className="text-xl md:text-2xl font-bold text-white mb-2">Synthesizing Source Code</h2>
                        <p className="text-blue-400 animate-pulse font-mono text-xs md:text-sm">Compiling HTML, CSS, and Logic...</p>
                    </div>
                );
            }

            // IDE View
            return (
                <div className="flex flex-col h-[100dvh] w-screen bg-[#0f111a] overflow-hidden relative">
                    
                    {/* Global Notifications */}
                    {toast && (
                        <div className="absolute bottom-20 md:bottom-6 left-1/2 z-[60] px-4 py-2.5 bg-blue-900/95 text-blue-100 border border-blue-700/50 rounded-lg shadow-2xl backdrop-blur-md flex items-center gap-2 text-xs md:text-sm font-medium animate-slideIn whitespace-nowrap">
                            <Icons.Wand className="w-4 h-4 text-blue-400" />
                            {toast}
                        </div>
                    )}

                    {/* Persistent IDE Error Banner */}
                    {previewError && (
                        <div className="absolute top-safe mt-16 md:mt-2 left-1/2 transform -translate-x-1/2 z-40 bg-red-900/95 text-red-200 px-3 md:px-5 py-2 md:py-2.5 rounded-lg border border-red-700 shadow-2xl flex flex-col md:flex-row items-start md:items-center gap-2 md:gap-3 w-[95%] md:w-auto max-w-4xl backdrop-blur-md">

                                <button onClick={() => setPreviewError(null)} className="ml-auto md:hidden text-red-400 p-1">✕</button>
                            </div>
                            <div className="flex items-center gap-2 w-full md:w-auto mt-1 md:mt-0">
                                <button 
                                    onClick={handleAutoFix} 
                                    disabled={isRefining} 
                                    className="flex-1 md:flex-none justify-center px-3 py-1.5 bg-red-700 hover:bg-red-600 text-white text-xs font-bold rounded flex items-center gap-1.5 transition disabled:opacity-50"
                                >
                                    {isRefining ? <span className="w-3 h-3 rounded-full border-2 border-white border-t-transparent animate-spin"></span> : <Icons.Wrench />}
                                    AUTO-FIX
                                </button>
                                <button onClick={() => setPreviewError(null)} className="hidden md:block ml-1 text-red-400 hover:text-white transition p-1">✕</button>
                            </div>
                        </div>
                    )}

                    {/* Top Navigation Bar */}
                    <div className="safe-h-header glass-panel border-b border-[#1e293b] flex items-center justify-between px-3 md:px-6 z-20 shrink-0 safe-pt">
                        <div className="flex items-center gap-2 md:gap-3 overflow-hidden">
                            <div className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-blue-600 flex items-center justify-center shrink-0 shadow-lg shadow-blue-500/20">
                                <Icons.Cpu className="w-4 h-4 md:w-5 md:h-5 text-white" />
                            </div>
                            <span className="font-bold text-gray-200 tracking-wide text-sm md:text-base hidden sm:inline">OmniGen Workspace</span>
                            <span className="font-bold text-gray-200 text-sm sm:hidden">OmniGen</span>
                            <span className="text-[10px] md:text-xs px-2 py-0.5 md:py-1 bg-slate-800 rounded-md text-slate-400 border border-slate-700 ml-1 md:ml-2 truncate max-w-[100px] sm:max-w-[150px] md:max-w-[200px]">
                                {prompt}
                            </span>
                        </div>

                        <div className="flex items-center gap-2 md:gap-4">
                            {/* Actions Group */}
                            <div className="flex items-center gap-1 md:gap-2">
                                <button onClick={handleUndo} disabled={historyIndex <= 0} className="p-1.5 text-gray-400 hover:text-white hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded-md transition-colors hidden md:block" title="Undo Generation">
                                    <Icons.Undo />
                                </button>
                                <button onClick={handleRedo} disabled={historyIndex >= codeHistory.length - 1} className="p-1.5 text-gray-400 hover:text-white hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded-md transition-colors hidden md:block" title="Redo Generation">
                                    <Icons.Redo />
                                </button>
                                <div className="hidden md:block h-4 w-px bg-slate-700 mx-1"></div>
                                <button onClick={handleSaveProject} className="p-1.5 text-blue-400 hover:text-blue-300 hover:bg-blue-900/30 rounded-md transition-colors hidden md:block" title="Save Project">
                                    <Icons.Save />
                                </button>
                                <button onClick={handleCopyCode} className="p-1.5 text-gray-400 hover:text-white hover:bg-slate-800 rounded-md transition-colors hidden md:block" title="Copy Code">
                                    <Icons.Copy />
                                </button>
                                <button onClick={handleDownloadFile} className="p-1.5 text-gray-400 hover:text-white hover:bg-slate-800 rounded-md transition-colors" title="Download HTML">
                                    <Icons.Download className="w-4 h-4 md:w-5 md:h-5" />
                                </button>
                            </div>

                            <div className="hidden md:block h-6 w-px bg-slate-700"></div>

                            {/* View Toggle Group - Desktop Only */}
                            <div className="hidden md:flex items-center gap-2 bg-[#1e293b] p-1 rounded-lg border border-[#334155]">
                                <button
                                    onClick={() => setActiveTab('preview')}
                                    className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'preview' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}
                                >
                                    <Icons.Play /> Preview
                                </button>
                                <button
                                    onClick={() => setActiveTab('code')}
                                    className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'code' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}
                                >
                                    <Icons.Code /> Code
                                </button>
                                <button
                                    onClick={() => setIsConsoleOpen(!isConsoleOpen)}
                                    className={`relative flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all ${isConsoleOpen ? 'bg-slate-700 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}
                                    title="Toggle Console"
                                >
                                    <Icons.Terminal /> 
                                    {logs.length > 0 && <span className="w-2 h-2 rounded-full bg-blue-500 absolute top-1 right-1 animate-pulse"></span>}
                                </button>
                            </div>
                            
                            <div className="h-4 md:h-6 w-px bg-slate-700 ml-1 md:ml-2"></div>

                            {/* Close / New Project */}
                            <button onClick={() => { setView('landing'); setPrompt(''); setCode(''); setPreviewError(null); }} className="text-red-400 hover:text-red-300 transition md:hidden p-1.5 ml-1">
                                <Icons.X className="w-5 h-5" />
                            </button>
                            <button onClick={() => { setView('landing'); setPrompt(''); setCode(''); setPreviewError(null); }} className="hidden md:block text-sm text-slate-400 hover:text-white transition ml-2 whitespace-nowrap">
                                ← New Project
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Area */}
                    <div className="flex-1 flex flex-col md:flex-row relative overflow-hidden pb-[calc(env(safe-area-inset-bottom,0px)+3.5rem)] md:pb-0">
                        
                        {/* Editor/Preview Container */}
                        <div className={`flex-1 relative flex-col min-w-0 ${activeTab === 'tools' ? 'hidden md:flex' : 'flex'}`}>
                            {/* Code Editor */}
                            <div className={`absolute inset-0 ${activeTab === 'code' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                                <MonacoEditor value={code} onChange={setCode} />
                            </div>

                            {/* Live Preview */}
                            <div className={`absolute inset-0 bg-white flex flex-col ${activeTab === 'preview' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                                <iframe
                                    srcDoc={getPreviewSrcDoc()}
                                    className="flex-1 w-full border-none bg-white"
                                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                                    title="App Preview"
                                />
                                {isConsoleOpen && (
                                    <div className="h-48 md:h-64 bg-[#0e1525] border-t border-[#2b3245] flex flex-col shrink-0 z-20 relative shadow-[0_-10px_20px_rgba(0,0,0,0.3)] animate-slideIn">
                                        <div className="h-9 bg-[#1c2333] border-b border-[#2b3245] flex items-center justify-between px-4 shrink-0">
                                            <div className="flex items-center gap-2 text-slate-300 font-medium text-xs">
                                                <Icons.Terminal /> Console Output
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => setLogs([])} className="p-1 text-slate-400 hover:text-white transition" title="Clear Console">
                                                    <Icons.Trash />
                                                </button>
                                                <button onClick={() => setIsConsoleOpen(false)} className="p-1 text-slate-400 hover:text-white transition" title="Close Console">
                                                    <Icons.X className="w-3 h-3" />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-3 font-mono text-[11px] lg:text-xs">
                                            {logs.length === 0 && <div className="text-slate-600 italic">Listening for output...</div>}
                                            {logs.map((log, i) => (
                                                <div key={i} className={`flex gap-3 mb-1.5 pb-1 border-b border-[#2b3245]/30 ${
                                                    log.type === 'omnigen-console-error' ? 'text-red-400 bg-red-500/5 px-2 -mx-2' : 
                                                    log.type === 'omnigen-console-warn' ? 'text-yellow-400' :
                                                    log.type === 'omnigen-console-info' ? 'text-blue-400' :
                                                    'text-slate-300'
                                                }`}>
                                                    <span className="text-slate-500 shrink-0 select-none">[{log.time}]</span>
                                                    <span className="text-slate-500 shrink-0 select-none">›</span>
                                                    <span className="whitespace-pre-wrap break-all leading-relaxed">{log.message}</span>
                                                </div>
                                            ))}
                                            <div className="flex gap-3 mt-2 text-slate-500">
                                                <span className="shrink-0 select-none">~</span>
                                                <span className="animate-pulse">_</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right Panel: Refinement Chat */}
                        <div className={`${activeTab === 'tools' ? 'flex' : 'hidden'} md:flex w-full md:w-[350px] border-t md:border-t-0 md:border-l border-[#1e293b] bg-[#0b0d14] flex-col shrink-0 z-20 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]`}>
                            <div className="h-12 border-b border-[#1e293b] flex items-center px-4 hidden md:flex">
                                <h3 className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                                    <Icons.Wand className="w-4 h-4" /> Modifier Tools
                                </h3>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 flex flex-col justify-end">
                                <div className="bg-[#1e293b] border border-[#334155] rounded-xl p-3 md:p-4 mb-3 md:mb-4 text-xs md:text-sm text-slate-300">
                                    <p className="mb-1 md:mb-2 text-white"><strong>App Generated!</strong></p>
                                    <p className="text-slate-400">Need changes? Ask OmniGen to refine logic, fix bugs, or add features.</p>
                                </div>
                                
                                {isRefining && (
                                    <div className="bg-[#1e293b]/50 border border-blue-500/30 rounded-xl p-3 md:p-4 mb-3 text-xs md:text-sm text-blue-300 flex items-center gap-3 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                                        <div className="w-4 h-4 rounded-full border-2 border-blue-500 border-t-transparent animate-spin shrink-0"></div>
                                        Rewriting mechanics...
                                    </div>
                                )}
                            </div>

                            <div className="p-3 md:p-4 border-t border-[#1e293b] bg-[#0f111a]">
                                <form onSubmit={handleRefine} className="relative">
                                    <textarea
                                        value={refinementPrompt}
                                        onChange={(e) => setRefinementPrompt(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleRefine(); }
                                        }}
                                        disabled={isRefining}
                                        placeholder="e.g. Add dark mode, speed up snake..."
                                        className="w-full bg-[#1e293b] border border-[#334155] rounded-xl pl-3 pr-10 py-3 text-white focus:outline-none focus:border-blue-500 resize-none h-[80px] md:h-[100px]"
                                    />
                                    <button
                                        type="submit"
                                        disabled={!refinementPrompt.trim() || isRefining}
                                        className="absolute bottom-3 right-3 p-1.5 bg-blue-600 disabled:bg-slate-700 text-white rounded-lg hover:bg-blue-500 transition"
                                    >
                                        <Icons.Send className="w-4 h-4" />
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    {/* Mobile Bottom Navigation Bar */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 safe-h-nav bg-[#0b0d14]/95 backdrop-blur-md border-t border-[#1e293b] flex items-center justify-around z-50 safe-pb">
                        <button onClick={() => setActiveTab('preview')} className={`flex flex-col items-center justify-center w-full h-14 transition-colors ${activeTab === 'preview' ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.Play className="w-5 h-5" />
                            <span className="text-[10px] mt-1 font-medium">Preview</span>
                        </button>
                        <button onClick={() => setActiveTab('code')} className={`flex flex-col items-center justify-center w-full h-14 transition-colors ${activeTab === 'code' ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.Code className="w-5 h-5" />
                            <span className="text-[10px] mt-1 font-medium">Code</span>
                        </button>
                        <button onClick={() => setIsConsoleOpen(!isConsoleOpen)} className={`flex flex-col items-center justify-center w-full h-14 transition-colors relative ${isConsoleOpen ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.Terminal className="w-5 h-5" />
                            {logs.length > 0 && <span className="w-2 h-2 rounded-full bg-blue-500 absolute top-2 right-4 border border-[#0b0d14]"></span>}
                            <span className="text-[10px] mt-1 font-medium">Console</span>
                        </button>
                        <button onClick={() => setActiveTab('tools')} className={`flex flex-col items-center justify-center w-full h-14 transition-colors ${activeTab === 'tools' ? 'text-blue-500' : 'text-slate-500'}`}>
                            <Icons.Wand className="w-5 h-5" />
                            <span className="text-[10px] mt-1 font-medium">Modify</span>
                        </button>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
